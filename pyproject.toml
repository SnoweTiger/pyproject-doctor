[project]
name = "pyproject-doctor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SnoweTiger", email = "snowetiger@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic>=2,<3",
    "ruff>=0.11,<1",
]

[project.scripts]
pyproject-doctor = "pyproject_doctor:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
